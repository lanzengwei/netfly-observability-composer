services:
  demo-api:
    build:
      context: .
      dockerfile: demo/Dockerfile
    environment:
      NETFLY_OBSERVABILITY_ENABLED: "true"
      NETFLY_OBSERVABILITY_PROJECT: demo-shop
      APP_ENV: local
      NETFLY_OBSERVABILITY_SERVICE: demo-api
      NETFLY_OBSERVABILITY_LOG_PATH: /app/demo/runtime/logs/netfly-observability.log
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "19501:9501"
    volumes:
      - demo-logs:/app/demo/runtime/logs
    depends_on:
      - mysql
      - redis
      - rabbitmq

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
    volumes:
      - ./demo/migrations/001_create_orders.sql:/docker-entrypoint-initdb.d/001_create_orders.sql:ro

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3-management-alpine

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - demo-api

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - demo-logs:/var/log/demo:ro
    depends_on:
      - loki
      - demo-api

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "13000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  demo-logs:
