apiVersion: 1

providers:
  - name: Netfly Observability
    orgId: 1
    folder: Netfly
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
  - name: Netfly Visual Maps
    orgId: 1
    folder: Netfly Visual
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/visual-dashboards
